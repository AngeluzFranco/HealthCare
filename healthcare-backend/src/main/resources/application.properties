# ===== DATABASE CONFIG (Environment Variables Driven) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:healthcare_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ===== SERVER CONFIG =====
server.port=${PORT:8080}
server.servlet.context-path=/api
server.compression.enabled=true
server.error.include-message=always

# ===== PRODUCTION SAFEGUARDS =====
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.main.allow-circular-references=true
spring.sql.init.mode=never

# ===== LOGGING =====
logging.level.com.healthcare=DEBUG
logging.level.org.springframework.web=${WEB_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
